<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>جلخامشة الوديّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;min-height:100%;
  background:#0a0005;
  font-family:'Tajawal','Amiri',sans-serif;
  direction:rtl;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  overflow:hidden;
  transition:opacity .7s ease, visibility .7s ease;
  background:#0d0010;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.splash-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 20% 20%, #ff9ecb55 0%, transparent 50%),
    radial-gradient(ellipse at 80% 10%, #c084fc44 0%, transparent 45%),
    radial-gradient(ellipse at 50% 80%, #fb7185aa 0%, transparent 55%),
    linear-gradient(160deg, #1a0030 0%, #0d0018 40%, #1a000a 100%);
  z-index:0;
}

.splash-blobs{
  position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;
}
.blob{
  position:absolute;border-radius:50%;filter:blur(60px);
  animation:blobFloat ease-in-out infinite;
  opacity:.35;
}
.blob1{width:280px;height:280px;background:#ff4d9e;top:-60px;right:-60px;animation-duration:8s;}
.blob2{width:220px;height:220px;background:#c084fc;bottom:-40px;left:-40px;animation-duration:10s;animation-delay:-3s;}
.blob3{width:180px;height:180px;background:#fb7185;top:40%;left:60%;animation-duration:7s;animation-delay:-5s;}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(20px,-20px) scale(1.05);}
  66%{transform:translate(-15px,15px) scale(.95);}
}

.splash-particles{position:absolute;inset:0;z-index:2;pointer-events:none;}
.sp{
  position:absolute;
  border-radius:50%;
  animation:floatUp linear infinite;
  opacity:0;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) scale(0);}
  10%{opacity:.8;}
  90%{opacity:.3;}
  100%{opacity:0;transform:translateY(-100vh) scale(1.5);}
}

.splash-garden{
  position:absolute;bottom:0;left:0;right:0;
  height:45%;
  z-index:2;
  display:flex;align-items:flex-end;
  justify-content:center;
  overflow:hidden;
}

.garden-grass{
  position:absolute;bottom:0;left:0;right:0;
  height:60px;
  background:linear-gradient(180deg,#2d6a1f,#1a3d10);
  border-radius:120% 120% 0 0;
  z-index:1;
}
.garden-grass::before{
  content:'';position:absolute;top:-18px;left:0;right:0;
  height:35px;
  background:linear-gradient(180deg,#3a8a28,#2d6a1f);
  border-radius:100% 100% 0 0;
}

.flower{
  position:absolute;bottom:30px;
  display:flex;flex-direction:column;align-items:center;
  z-index:3;
  animation:flowerSway ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes flowerSway{
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
}
.flower-stem{
  width:4px;
  background:linear-gradient(180deg,#3a8a28,#2d6a1f);
  border-radius:2px;
  position:relative;
}
.flower-stem::before{
  content:'🌿';
  position:absolute;
  font-size:.9rem;
  right:-14px;top:30%;
}
.flower-head{
  font-size:1.8rem;
  margin-bottom:-4px;
  filter:drop-shadow(0 0 6px #ff69b488);
  animation:bloomPulse ease-in-out infinite;
}
@keyframes bloomPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}

.splash-center{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;
  gap:28px;
  margin-bottom:30px;
  padding:0 24px;
}

.splash-logo-wrap{
  display:flex;flex-direction:column;align-items:center;gap:16px;
}

.splash-icon-ring{
  position:relative;
  width:110px;height:110px;
  display:flex;align-items:center;justify-content:center;
}
.splash-icon-ring::before{
  content:'';
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(#0d0010,#0d0010) padding-box,
              linear-gradient(135deg,#ff4d9e,#c084fc,#fb7185,#ff4d9e) border-box;
  animation:ringRotate 6s linear infinite;
}
.splash-icon-ring::after{
  content:'';
  position:absolute;inset:6px;
  border-radius:50%;
  border:1px solid #ff4d9e33;
}
@keyframes ringRotate{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.splash-main-icon{
  font-size:3.2rem;
  filter:drop-shadow(0 0 18px #ff69b4) drop-shadow(0 0 36px #ff1493);
  animation:iconPulse 3s ease-in-out infinite;
  position:relative;z-index:1;
}
@keyframes iconPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.1);}
}

.splash-title{
  font-size:clamp(1.5rem,5.5vw,2.2rem);
  font-weight:900;
  color:#fff;
  text-align:center;
  letter-spacing:1px;
  line-height:1.4;
  text-shadow:0 2px 20px #ff4d9e66;
}
.splash-sub{
  font-size:clamp(.85rem,3vw,1rem);
  color:#ffb3d988;
  text-align:center;
  letter-spacing:2px;
  font-weight:400;
}

.splash-divider{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,#ff4d9e88,transparent);
}

.splash-hint{
  font-size:.85rem;
  color:#ffb3d966;
  text-align:center;
  letter-spacing:1px;
}

#splash-btn{
  width:72px;height:72px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#ff4d9e,#c084fc,#fb7185);
  color:#fff;
  font-size:1.6rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 32px #ff4d9e66, 0 0 0 0 #ff4d9e44;
  outline:none;
  transition:box-shadow .2s,transform .2s;
  position:relative;
  animation:btnGlow 2.5s ease-in-out infinite;
}
@keyframes btnGlow{
  0%,100%{box-shadow:0 8px 32px #ff4d9e66, 0 0 0 0 #ff4d9e44;}
  50%{box-shadow:0 8px 40px #ff4d9e99, 0 0 0 12px #ff4d9e11;}
}
#splash-btn::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid #ff4d9e44;animation:rippleSplash 2.2s linear infinite;
}
#splash-btn::after{
  content:'';position:absolute;inset:-14px;border-radius:50%;
  border:1px solid #ff4d9e22;animation:rippleSplash 2.2s linear infinite .7s;
}
@keyframes rippleSplash{
  0%{transform:scale(1);opacity:.7;}
  100%{transform:scale(1.5);opacity:0;}
}
#splash-btn:hover{transform:scale(1.07);}
#splash-btn:active{transform:scale(.94);}

#loader-screen{
  position:fixed;inset:0;z-index:9998;
  background:#0d0010;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;
  opacity:0;visibility:hidden;transition:opacity .3s;
}
#loader-screen.show{opacity:1;visibility:visible;}
#loader-screen.hide{opacity:0;visibility:hidden;}
.loader-title{font-size:clamp(1rem,3.5vw,1.5rem);color:#ff85c2;font-weight:700;letter-spacing:3px;opacity:.9;}
.loader-bar-wrap{
  width:min(320px,78vw);height:7px;
  background:#2a0018;border-radius:99px;overflow:hidden;
  border:1px solid #ff69b433;box-shadow:0 0 14px #ff69b422;
}
.loader-bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#ff0066,#ff69b4,#ff85c2,#ff0066);
  background-size:300% 100%;
  animation:barShine 1.2s linear infinite;
  transition:width .05s linear;
}
@keyframes barShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.loader-percent{font-size:.95rem;color:#ff8fab;font-weight:700;letter-spacing:2px;}

#app{display:none;flex-direction:column;min-height:100vh;}
#app.visible{display:flex;}

#stars-global{position:fixed;inset:0;z-index:0;pointer-events:none;}

#home-menu{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:50px 20px 80px;
  transition:opacity .35s ease, transform .35s ease;
}
#home-menu.hide-out{opacity:0;transform:scale(.96);pointer-events:none;}

.home-profile-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:12px;margin-bottom:36px;
}
.home-avatar{
  width:clamp(110px,28vw,155px);height:clamp(110px,28vw,155px);
  border-radius:50%;object-fit:cover;
  border:3px solid #ff69b4;
  box-shadow:0 0 28px #ff69b455;
}
.home-avatar-ph{
  width:clamp(110px,28vw,155px);height:clamp(110px,28vw,155px);
  border-radius:50%;border:3px solid #ff69b4;
  background:#1a0010;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;box-shadow:0 0 28px #ff69b455;
}
.home-name{
  font-size:clamp(1.4rem,4.5vw,2.1rem);
  font-weight:900;color:#ff69b4;
  text-shadow:0 0 14px #ff69b466;text-align:center;
}
.home-subtitle{font-size:.9rem;color:#ff8fab77;letter-spacing:2px;margin-top:2px;}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  width:100%;max-width:480px;
}
.menu-card{
  background:linear-gradient(135deg,#110008ee,#1e000dee);
  border:1.5px solid #ff2e2e33;
  border-radius:18px;
  padding:22px 16px 18px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
  text-align:center;
  position:relative;overflow:hidden;
  transition:border-color .25s,box-shadow .25s,transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.menu-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,#ff2e2e11,transparent 70%);
  opacity:0;transition:opacity .25s;
}
.menu-card:hover{border-color:#ff69b499;box-shadow:0 6px 28px #ff69b433;transform:translateY(-3px);}
.menu-card:hover::before{opacity:1;}
.menu-card:active{transform:scale(.97);}
.menu-card-icon{font-size:2rem;line-height:1;}
.menu-card-label{font-size:.92rem;font-weight:700;color:#ffd6e7dd;line-height:1.3;}

#notif-fab{
  position:fixed;
  bottom:26px;left:20px;
  z-index:200;
  width:52px;height:52px;
  border-radius:50%;
  border:2px solid #ff69b4aa;
  background:radial-gradient(circle at 35% 30%,#3a0025,#0d0010);
  box-shadow:0 4px 24px #ff69b444, inset 0 0 12px #ff006633;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:box-shadow .2s,transform .2s;
  -webkit-tap-highlight-color:transparent;
}
#notif-fab:hover{box-shadow:0 6px 32px #ff69b477,inset 0 0 16px #ff006655;transform:scale(1.08);}
#notif-fab:active{transform:scale(.93);}
.notif-fab-icon{font-size:1.3rem;}
#notif-fab-badge{
  position:absolute;top:-4px;right:-4px;
  background:#ff2e2e;color:#fff;font-size:.6rem;font-weight:900;
  border-radius:99px;padding:2px 5px;min-width:18px;text-align:center;
  border:1.5px solid #0d0010;display:none;
}
#notif-fab-badge.show{display:block;}

#notif-drawer{
  position:fixed;bottom:90px;left:16px;
  z-index:201;
  width:min(300px, calc(100vw - 32px));
  background:linear-gradient(145deg,#1a0012f5,#0d000af5);
  border:1.5px solid #ff69b444;border-radius:20px;
  box-shadow:0 8px 40px #ff69b433;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform:translateY(20px) scale(.95);
  opacity:0;visibility:hidden;
  transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s, visibility .3s;
  overflow:hidden;
}
#notif-drawer.open{transform:translateY(0) scale(1);opacity:1;visibility:visible;}

.notif-drawer-header{
  padding:14px 16px 10px;
  border-bottom:1px solid #ff69b422;
  display:flex;align-items:center;justify-content:space-between;
}
.notif-drawer-title{font-size:.9rem;font-weight:900;color:#ff69b4;letter-spacing:1px;}
.notif-clear-btn{
  font-size:.72rem;color:#ff8fab88;
  background:none;border:none;cursor:pointer;
  font-family:'Tajawal',sans-serif;transition:color .2s;
}
.notif-clear-btn:hover{color:#ff69b4;}

.notif-list-inner{
  max-height:260px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#ff69b433 transparent;
  padding:8px 0;
}
.notif-item{
  padding:10px 16px;cursor:pointer;
  display:flex;align-items:flex-start;gap:10px;
  transition:background .2s;border-bottom:1px solid #ff69b411;
}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:#ff69b40e;}
.notif-item:active{background:#ff69b41a;}
.notif-dot-sm{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.notif-dot-sm.green{background:#22ff88;box-shadow:0 0 6px #22ff8877;}
.notif-dot-sm.red{background:#ff2e2e;box-shadow:0 0 6px #ff2e2e77;}
.notif-item-body{flex:1;}
.notif-item-label{font-size:.82rem;font-weight:700;color:#ffd6e7cc;margin-bottom:2px;}
.notif-item-msg{font-size:.76rem;color:#ff8fab88;line-height:1.4;}
.notif-item-time{font-size:.7rem;color:#ff8fab44;margin-top:3px;}
.notif-empty{text-align:center;padding:24px 16px;color:#ff8fab44;font-size:.85rem;}

#section-page{
  position:fixed;inset:0;z-index:10;
  background:#000;
  display:flex;flex-direction:column;
  transform:translateX(-100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
#section-page.slide-in{transform:translateX(0);}
.sec-header{
  position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,#0d000a,#130008);
  border-bottom:1.5px solid #ff69b433;
  box-shadow:0 2px 20px #ff69b422;
  display:flex;align-items:center;
  gap:12px;padding:12px 16px;min-height:56px;
}
#back-btn{
  background:none;border:1.5px solid #ff69b444;
  color:#ff69b4;font-size:1.4rem;cursor:pointer;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;flex-shrink:0;
}
#back-btn:hover{background:#2a000f;border-color:#ff69b4;}
#back-btn:active{transform:scale(.93);}
.sec-header-title{
  font-size:clamp(1rem,3.5vw,1.3rem);
  font-weight:900;color:#ff69b4;
  text-shadow:0 0 10px #ff69b433;flex:1;
}
#section-content{flex:1;padding:24px 16px 60px;position:relative;z-index:1;}

@media(max-width:360px){
  .menu-grid{gap:10px;}
  .menu-card{padding:18px 10px 14px;}
  .menu-card-icon{font-size:1.7rem;}
  .menu-card-label{font-size:.82rem;}
}
</style>
</head>
<body>

<audio id="bg-audio" loop preload="auto">
  <source src="https://raw.githubusercontent.com/FDH-repo/FDH-repo/main/%F0%9F%8E%B6T%F0%9F%8E%B6H%F0%9F%8E%B6R.ogg" type="audio/ogg"/>
</audio>
<canvas id="stars-global"></canvas>

<div id="splash">
  <div class="splash-bg"></div>
  <div class="splash-blobs">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>
  <div class="splash-particles" id="splash-particles"></div>

  <div class="splash-center">
    <div class="splash-logo-wrap">
      <div class="splash-icon-ring">
        <span class="splash-main-icon">🌸</span>
      </div>
      <h1 class="splash-title">جلجامشة الوردية</h1>
      <p class="splash-sub">هاذا المكان يعرض فيه طيز جلجامشة 🍑🤧 وزب شادو 🥒 الذي يخترق احشائها 🫢🔥</p>
    </div>

    <div class="splash-divider"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <button id="splash-btn" aria-label="دخول">✦</button>
      <span class="splash-hint">🩸إضغط للمتابتة🩸</span>
    </div>
  </div>

  <div class="splash-garden" id="splash-garden">
    <div class="garden-grass"></div>
  </div>
</div>

<div id="loader-screen">
  <p class="loader-title">جاري دخول زب شادو في طيز جلجامشة 🍑🥒</p>
  <div class="loader-bar-wrap">
    <div class="loader-bar-fill" id="loader-fill"></div>
  </div>
  <p class="loader-percent" id="loader-pct">0%</p>
</div>

<div id="app">
  <div id="home-menu"></div>

  <button id="notif-fab" aria-label="الإشعارات">
    <span class="notif-fab-icon">🔔</span>
    <span id="notif-fab-badge">0</span>
  </button>

  <div id="notif-drawer" role="dialog" aria-label="الإشعارات">
    <div class="notif-drawer-header">
      <span class="notif-drawer-title">🔔 الإشعارات</span>
      <button class="notif-clear-btn" id="notif-clear-btn">مسح الكل</button>
    </div>
    <div class="notif-list-inner" id="notif-list-inner"></div>
  </div>

  <div id="section-page" aria-hidden="true">
    <header class="sec-header">
      <button id="back-btn" aria-label="رجوع">&#8592;</button>
      <h2 class="sec-header-title" id="sec-header-title">القسم</h2>
    </header>
    <div id="section-content"></div>
  </div>
</div>

<script>
(function(){
  const c=document.getElementById('stars-global');
  function draw(){
    c.width=window.innerWidth;c.height=window.innerHeight;
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<260;i++){
      const x=Math.random()*c.width,y=Math.random()*c.height;
      const r=Math.random()*1.3+.2,a=Math.random()*.6+.1;
      const hue=Math.random()>0.7?'255,182,193':'255,255,255';
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${hue},${a})`;ctx.fill();
    }
  }
  draw();window.addEventListener('resize',draw);
})();

(function(){
  const garden=document.getElementById('splash-garden');
  const particles=document.getElementById('splash-particles');
  const flowers=[
    {bottom:'28px',left:'5%',stemH:70,delay:0,dur:3.2,flowerType:'🌸'},
    {bottom:'24px',left:'13%',stemH:50,delay:.4,dur:2.8,flowerType:'🌺'},
    {bottom:'30px',left:'22%',stemH:85,delay:.2,dur:3.5,flowerType:'🌷'},
    {bottom:'22px',left:'31%',stemH:55,delay:.7,dur:2.6,flowerType:'🌸'},
    {bottom:'26px',left:'40%',stemH:75,delay:.1,dur:3.1,flowerType:'💮'},
    {bottom:'28px',left:'50%',stemH:65,delay:.5,dur:2.9,flowerType:'🌸'},
    {bottom:'24px',left:'59%',stemH:80,delay:.3,dur:3.4,flowerType:'🌺'},
    {bottom:'30px',left:'68%',stemH:55,delay:.6,dur:2.7,flowerType:'🌷'},
    {bottom:'22px',left:'77%',stemH:70,delay:.15,dur:3.0,flowerType:'🌸'},
    {bottom:'26px',left:'86%',stemH:60,delay:.45,dur:3.3,flowerType:'💮'},
    {bottom:'28px',left:'93%',stemH:50,delay:.25,dur:2.8,flowerType:'🌸'},
  ];
  flowers.forEach(f=>{
    const el=document.createElement('div');
    el.className='flower';
    el.style.cssText=`bottom:${f.bottom};left:${f.left};animation-duration:${f.dur}s;animation-delay:${f.delay}s;`;
    el.innerHTML=`
      <div class="flower-head" style="animation-delay:${f.delay}s">${f.flowerType}</div>
      <div class="flower-stem" style="height:${f.stemH}px"></div>`;
    garden.appendChild(el);
  });
  const colors=['#ff69b4','#ffb3d9','#ff85c2','#ffe0f0','#ff1493','#ffc0cb'];
  for(let i=0;i<35;i++){
    const sp=document.createElement('div');
    sp.className='sp';
    const size=(Math.random()*5+3)+'px';
    const left=(Math.random()*100)+'%';
    const dur=(Math.random()*8+6)+'s';
    const delay=(Math.random()*8)+'s';
    const color=colors[Math.floor(Math.random()*colors.length)];
    sp.style.cssText=`width:${size};height:${size};left:${left};bottom:${Math.random()*30}%;background:${color};box-shadow:0 0 8px ${color};animation-duration:${dur};animation-delay:${delay};`;
    particles.appendChild(sp);
  }
})();

(function(){
  const splash=document.getElementById('splash');
  const splashBtn=document.getElementById('splash-btn');
  const loaderScr=document.getElementById('loader-screen');
  const loaderFill=document.getElementById('loader-fill');
  const loaderPct=document.getElementById('loader-pct');
  const app=document.getElementById('app');
  const audio=document.getElementById('bg-audio');

  splashBtn.addEventListener('click',startLoader);

  function startLoader(){
    splash.classList.add('hidden');
    loaderScr.classList.add('show');
    let pct=0;
    const steps=[{target:30,speed:22},{target:65,speed:35},{target:88,speed:18},{target:100,speed:28}];
    let si=0;
    function tick(){
      if(pct>=100){
        loaderFill.style.width='100%';loaderPct.textContent='100%';
        setTimeout(showApp,300);return;
      }
      if(pct>=steps[si].target&&si<steps.length-1)si++;
      pct=Math.min(pct+(Math.random()*.8+.4),100);
      loaderFill.style.width=pct+'%';
      loaderPct.textContent=Math.floor(pct)+'%';
      setTimeout(tick,steps[si].speed);
    }
    tick();
  }

  function showApp(){
    loaderScr.classList.remove('show');loaderScr.classList.add('hide');
    app.classList.add('visible');
    audio.volume=.45;
    audio.play().catch(()=>document.addEventListener('click',()=>audio.play(),{once:true}));
    buildHomeMenu();
    buildNotifFab();
  }
})();

const MENU_ITEMS=[
  {id:'news',       icon:'📰', label:'أحدث الأخبار',  file:'news.js',       global:'NewsSection'       },
  {id:'videos',     icon:'🎬', label:'إبادة الحية',    file:'videos.js',     global:'VideosSection'     },
  {id:'photos',     icon:'🖼', label:'دعس وفضائح',     file:'photos.js',     global:'PhotosSection'     },
  {id:'blogs',      icon:'📝', label:'مدونات',          file:'blogs.js',      global:'BlogsSection'      },
  {id:'links',      icon:'🔗', label:'روابط',           file:'links.js',      global:'LinksSection'      },
  {id:'info',       icon:'ℹ️', label:'معلومات',         file:'info.js',       global:'InfoSection'       },
  {id:'supporters', icon:'💖', label:'من دعموني',       file:'supporters.js', global:'SupportersSection' },
];

const NOTIFICATIONS=[
  {section:'news',   label:'📰 أحدث الأخبار', dot:'green', badge:3, msg:'تم إضافة 3 أخبار جديدة!',      time:'2025/01/15 — 10:30 م'},
  {section:'videos', label:'🎬 فيديوهات',      dot:'red',   badge:1, msg:'فيديو جديد تم رفعه الآن',      time:'2025/01/14 — 08:00 م'},
  {section:'photos', label:'🖼 صور',            dot:'green', badge:5, msg:'تمت إضافة 5 صور جديدة',        time:'2025/01/13 — 04:15 م'},
  {section:'blogs',  label:'📝 مدونات',         dot:'red',   badge:2, msg:'مدونتان جديدتان في انتظارك',  time:'2025/01/12 — 09:00 ص'},
];

const HOME_AVATAR="https://i.imgur.com/S3dRPKW.jpg";

function buildHomeMenu(){
  const menu=document.getElementById('home-menu');
  const avatarHTML=HOME_AVATAR
    ?`<img class="home-avatar" src="${HOME_AVATAR}" alt="جلخامجة الوردية" onerror="this.outerHTML='<div class=home-avatar-ph></div>'">`
    :`<div class="home-avatar-ph"></div>`;

  const cardsHTML=MENU_ITEMS.map(item=>`
    <div class="menu-card" data-id="${item.id}" data-file="${item.file}" data-global="${item.global}" data-label="${item.label} ${item.icon}">
      <span class="menu-card-icon">${item.icon}</span>
      <span class="menu-card-label">${item.label}</span>
    </div>
  `).join('');

  menu.innerHTML=`
    <div class="home-profile-wrap">
      ${avatarHTML}
      <h1 class="home-name">🌸جلجامشة الوردية🌸</h1>
      <p class="home-subtitle">اختر القسم الذي تريده</p>
    </div>
    <div class="menu-grid">${cardsHTML}</div>
  `;

  menu.querySelectorAll('.menu-card').forEach(card=>{
    card.addEventListener('click',()=>{
      openSection(card.dataset.id, card.dataset.file, card.dataset.global, card.dataset.label, card);
    });
  });
}

function buildNotifFab(){
  const fab=document.getElementById('notif-fab');
  const badge=document.getElementById('notif-fab-badge');
  const drawer=document.getElementById('notif-drawer');
  const listInner=document.getElementById('notif-list-inner');
  const clearBtn=document.getElementById('notif-clear-btn');
  let notifs=[...NOTIFICATIONS];
  let drawerOpen=false;

  function renderBadge(){
    const total=notifs.reduce((s,n)=>s+n.badge,0);
    if(total>0){badge.textContent=total;badge.classList.add('show');}
    else{badge.classList.remove('show');}
  }
  function renderList(){
    if(!notifs.length){listInner.innerHTML=`<div class="notif-empty">🌸 لا توجد إشعارات</div>`;return;}
    listInner.innerHTML=notifs.map((n,i)=>`
      <div class="notif-item" data-idx="${i}" data-section="${n.section}">
        <span class="notif-dot-sm ${n.dot}"></span>
        <div class="notif-item-body">
          <div class="notif-item-label">${n.label}</div>
          <div class="notif-item-msg">${n.msg}</div>
          <div class="notif-item-time">🕐 ${n.time}</div>
        </div>
      </div>`).join('');
    listInner.querySelectorAll('.notif-item').forEach(item=>{
      item.addEventListener('click',()=>{
        const sec=item.dataset.section;
        closeDrawer();
        const mi=MENU_ITEMS.find(m=>m.id===sec);
        if(mi) openSection(mi.id,mi.file,mi.global,`${mi.label} ${mi.icon}`);
      });
    });
  }
  function openDrawer(){drawerOpen=true;renderList();drawer.classList.add('open');fab.style.background='radial-gradient(circle at 35% 30%,#5a0035,#1a0015)';}
  function closeDrawer(){drawerOpen=false;drawer.classList.remove('open');fab.style.background='';}

  fab.addEventListener('click',(e)=>{e.stopPropagation();drawerOpen?closeDrawer():openDrawer();});
  clearBtn.addEventListener('click',()=>{notifs=[];renderBadge();renderList();});
  document.addEventListener('click',(e)=>{
    if(drawerOpen&&!drawer.contains(e.target)&&e.target!==fab)closeDrawer();
  });
  renderBadge();
}

const loadedScripts = new Set();
const checkedFiles  = new Map();

function pulseCard(cardEl) {
  if (!cardEl) return;
  cardEl.style.transition = 'transform .12s ease';
  cardEl.style.transform  = 'scale(1.08)';
  setTimeout(() => { cardEl.style.transform = ''; }, 180);
}

function openSection(id, file, globalName, label, cardEl) {
  if (checkedFiles.get(file) === false) {
    pulseCard(cardEl);
    return;
  }
  if (checkedFiles.get(file) === true) {
    _doOpen(id, file, globalName, label, cardEl);
    return;
  }
  fetch(file, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        checkedFiles.set(file, true);
        _doOpen(id, file, globalName, label, cardEl);
      } else {
        checkedFiles.set(file, false);
        pulseCard(cardEl);
      }
    })
    .catch(() => {
      checkedFiles.set(file, false);
      pulseCard(cardEl);
    });
}

function _doOpen(id, file, globalName, label, cardEl) {
  const homeMenu    = document.getElementById('home-menu');
  const sectionPage = document.getElementById('section-page');
  const headerTitle = document.getElementById('sec-header-title');
  const secContent  = document.getElementById('section-content');
  const fab         = document.getElementById('notif-fab');

  homeMenu.classList.add('hide-out');
  fab.style.display = 'none';

  headerTitle.textContent = label;
  secContent.innerHTML = '';

  sectionPage.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => requestAnimationFrame(() => sectionPage.classList.add('slide-in')));

  if (!loadedScripts.has(file)) {
    const s = document.createElement('script');
    s.src    = file;
    s.onload = () => loadedScripts.add(file);
    document.body.appendChild(s);
  }
}

document.getElementById('back-btn').addEventListener('click', closeSection);

function closeSection(){
  const homeMenu    = document.getElementById('home-menu');
  const sectionPage = document.getElementById('section-page');
  const fab         = document.getElementById('notif-fab');
  sectionPage.classList.remove('slide-in');
  sectionPage.setAttribute('aria-hidden', 'true');
  setTimeout(() => { homeMenu.classList.remove('hide-out'); fab.style.display = ''; }, 50);
}

window.addEventListener('popstate', () => {
  const sp = document.getElementById('section-page');
  if (sp.classList.contains('slide-in')) closeSection();
});
</script>
